<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSL Project Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom animation effect */
        .nav-link span {
            position: relative;
        }

        .nav-link::before,
        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #00fffc;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .nav-link::before {
            top: 0;
            left: 0;
            transform-origin: left;
        }

        .nav-link::after {
            bottom: 0;
            right: 0;
            transform-origin: right;
        }

        .nav-link:hover::before,
        .nav-link:hover::after {
            transform: scaleX(1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Navbar ko parto -->
    <nav class="bg-gray-800 shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Title ya logo halna tau-->
            <div class="text-xl font-bold text-white">NSL Project</div>
        
            <ul class="flex space-x-8">
                <li><a href="{{ url_for('main') }}" class="nav-link font-semibold text-white hover:text-teal-400 transition duration-200"><span>Home</span></a></li>
                <li><a href="{{ url_for('symbols') }}" class="nav-link font-semibold text-white hover:text-teal-400 transition duration-200"><span>Symbols</span></a></li>
                <li><a href="{{ url_for('upload') }}" class="nav-link font-semibold text-white hover:text-teal-400 transition duration-200"><span>Image Upload</span></a></li>
                <li><a href="{{ url_for('live_detection') }}" class="nav-link font-semibold text-white hover:text-teal-400 transition duration-200"><span>Live Detection</span></a></li>
                <li><a href="{{ url_for('live_word_detection') }}" class="nav-link font-semibold text-white hover:text-teal-400 transition duration-200"><span>Live word Detection</span></a></li>
            </ul>
        </div>
    </nav>
</body>
</html>
